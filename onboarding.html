<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F7; --card:#FFFFFF; --line:#DDE0E6; --soft:#E7E9EE;
    --ink:#16181D; --muted:#596070; --accent:#2F55D4; --accent-bg:#EEF2FC;
    --ready:#C2410C; --ready-bg:#FFF4ED;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
  .wrap{max-width:1360px;margin:0 auto;padding:40px 32px 120px;display:flex;flex-direction:column;gap:20px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* Header */
  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px}
  .top h1{margin:6px 0 0;font-size:32px;line-height:40px;font-weight:600}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
  .field select,.field input{height:44px;border:1px solid #C9CED8;border-radius:8px;background:#fff;padding:0 12px;font:inherit;font-size:14px;color:var(--ink)}
  .field input.initials{width:120px;text-transform:uppercase;font-family:var(--mono)}
  .btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid #C9CED8;background:#fff;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .btn:focus-visible,.task:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .addrow{display:none;gap:8px;align-items:flex-end}
  .addrow.open{display:flex}
  a.btn{display:inline-flex;align-items:center;text-decoration:none}
  .syncstate{font-size:12px;color:var(--muted);min-height:16px;margin-top:6px}
  .syncstate.err{color:#B42318;font-weight:500}
  body.home .viewtoggle,body.home #copyLink,body.home #backLink,body.home .launched,body.home #rows,body.home #flowWrap,body.home .syncstate{display:none!important}
  body:not(.home) #home,body:not(.home) #addToggle,body:not(.home) #addRow{display:none!important}
  .home-list{display:flex;flex-direction:column;gap:8px}
  .home-item{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;text-decoration:none;color:var(--ink)}
  .home-item:hover{border-color:var(--accent)}
  .home-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .home-name{font-size:16px;font-weight:600;flex:1;min-width:0}
  .home-meta{font-size:13px;color:var(--muted);white-space:nowrap}
  .home-bar{width:120px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;flex:none}
  .home-bar span{display:block;height:100%;background:var(--accent)}
  .home-empty{color:var(--muted);font-size:14px;padding:24px 0}
  @media (max-width:640px){.home-bar{display:none}}

  /* Status key */
  .key{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;font-size:13px;color:var(--muted)}
  .key span{display:inline-flex;align-items:center;gap:8px}
  .kdot{width:18px;height:18px;border-radius:9px;border:2px solid #B4BAC6;background:#fff;display:inline-flex;align-items:center;justify-content:center}
  .kdot.done{background:var(--ink);border-color:var(--ink)}
  .kdot.ready{border-color:var(--ready);background:var(--ready-bg)}
  .kdot.wait{border-style:dashed;background:#F4F5F7}
  .kdot.need{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

  /* Rows */
  .viewtoggle{display:inline-flex;align-self:flex-end;background:var(--soft);border-radius:10px;padding:4px;gap:2px}
  .viewtoggle button{height:36px;padding:0 14px;border:0;border-radius:7px;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
  .viewtoggle button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,24,29,.12)}
  .flowwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  .flowwrap[hidden],.rows[hidden]{display:none}
  .flow{position:relative;display:flex;gap:56px;padding:24px;min-width:max-content}
  .flow-col{display:flex;flex-direction:column;gap:10px;width:200px;position:relative;z-index:1}
  .flow-col.grow{animation:grow .35s ease both}
  @keyframes grow{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  .flow-col h3{margin:0 0 4px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .flow-lines{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
  .flow-lines path{fill:none;stroke:#C9CED8;stroke-width:1.5;transition:opacity .12s}
  .flow-lines path.met{stroke:var(--ink)}
  .tracing .flow-lines path{opacity:.12}
  .tracing .flow-lines path.on{opacity:1;stroke:var(--accent);stroke-width:2}
  .fnode{position:relative;display:flex;align-items:flex-start;gap:8px;width:100%;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:13px;line-height:17px;text-align:left;color:var(--ink);cursor:pointer;transition:opacity .12s,border-color .12s}
  .fnode:hover{border-color:var(--ink)}
  .fdot{width:20px;height:20px;flex:none;border-radius:10px;border:2px solid #B4BAC6;background:#fff;display:flex;align-items:center;justify-content:center;color:#8A90A0}
  .fdot svg{width:11px;height:11px;display:block}
  .fnode.done .fdot{background:var(--ink);border-color:var(--ink)}
  .fnode.done .flabel{color:var(--muted);text-decoration:line-through}
  .fnode.waiting .fdot{border-style:dashed;background:#F4F5F7}
  .fnode.waiting .flabel{color:var(--muted)}
  .fcode{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:1px;flex:none}
  .fsticky{top:-8px;left:auto;right:-6px;width:16px;height:16px}
  .tracing .fnode{opacity:.3}
  .tracing .fnode.t-focus,.tracing .fnode.t-need,.tracing .fnode.t-unlock{opacity:1}
  .fnode.t-focus{border-color:var(--ink);box-shadow:0 0 0 2px rgba(22,24,29,.12)}
  .fnode.t-need{border-color:var(--accent);background:var(--accent-bg)}
  .fnode.t-unlock{border-color:var(--accent);border-style:dashed}
  @media (prefers-reduced-motion:reduce){.flow-col.grow{animation:none}}
  .setup{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px}
  .setup-title{font-size:14px;font-weight:600;align-self:center;margin-right:4px}
  .setup-group{display:flex;flex-direction:column;gap:4px}
  .setup-label{font-size:12px;font-weight:500;color:var(--muted)}
  .seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
  .seg button{height:34px;padding:0 12px;border:0;border-radius:7px;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,24,29,.12)}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .due{display:block;font-size:11px;line-height:15px;color:var(--muted);font-family:'IBM Plex Sans',sans-serif;font-weight:500;text-decoration:none}
  .due.today{color:#8A5A00}
  .due.overdue{color:#B42318;font-weight:600}
  .p-status .due{display:inline;font-size:13px}
  .flabel .due{margin-top:2px}
  .rows{display:flex;flex-direction:column;gap:12px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-wrap:wrap;align-items:stretch;overflow:hidden}
  .row > .track-scroll{flex:1 1 0}
  .strip{width:100%;display:flex;align-items:stretch;background:#F8F9FB;border-top:1px solid var(--soft)}
  .strip-head{width:200px;flex:none;padding:12px 20px;border-right:1px solid var(--soft);display:flex;align-items:center;gap:10px;font-size:13px;color:#3D4350}
  .strip-head b{font-weight:600}
  .avatar{width:28px;height:28px;flex:none;border-radius:14px;background:var(--soft);color:#3D4350;display:flex;align-items:center;justify-content:center}
  .strip-items{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 20px}
  .strip-sep{width:1px;height:24px;background:var(--soft)}
  .citem{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 8px;border-radius:8px;cursor:pointer;font-size:14px}
  .citem:hover{background:#EEF0F4}
  .citem input{position:absolute;opacity:0;width:1px;height:1px}
  .cbox{width:24px;height:24px;flex:none;border-radius:12px;border:2px solid #B4BAC6;background:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .cbox svg{opacity:0}
  .citem:hover .cbox{border-color:var(--ink)}
  .citem input:checked + .cbox{background:var(--ink);border-color:var(--ink)}
  .citem input:checked + .cbox svg{opacity:1}
  .citem input:focus-visible + .cbox{outline:2px solid var(--accent);outline-offset:2px}
  .citem.ok > span:last-child{color:var(--muted);text-decoration:line-through}
  .row-head{width:200px;flex:none;padding:20px;border-right:1px solid var(--soft);display:flex;flex-direction:column;gap:6px;justify-content:center}
  .row-head .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .row-head h2{margin:0;font-size:17px;line-height:22px;font-weight:600}
  .row-head .count{font-size:13px;color:var(--muted)}
  .row-head .state{font-size:12px;font-weight:500;color:var(--muted)}
  .row.inprog .row-head .state{color:var(--accent)}
  .row.complete .row-head .state{color:var(--ink)}

  .track-scroll{flex:1;min-width:0;overflow-x:auto}
  .track{position:relative;display:flex;align-items:flex-start;padding:22px 20px 18px;min-width:min-content}
  .rail{position:absolute;top:43px;height:3px;background:var(--soft);border-radius:2px}
  .rail-fill{position:absolute;top:43px;height:3px;background:var(--ink);border-radius:2px;width:0;transition:width .5s ease}

  .task{position:relative;z-index:1;flex:0 1 136px;min-width:108px;background:none;border:0;padding:0 8px;font:inherit;color:inherit;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:10px;transition:opacity .15s}
  .dot{width:44px;height:44px;border-radius:22px;border:2px solid #B4BAC6;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--muted);transition:background .2s,border-color .2s,box-shadow .15s}
  .dot .ico-check,.dot .ico-lock{display:none}
  .task-label{font-size:13px;line-height:18px;color:var(--ink)}
  .sub{font-size:11px;line-height:16px;min-height:16px}

  /* done */
  .task.done .dot{background:var(--ink);border-color:var(--ink)}
  .task.done .dot .ico-check{display:block}
  .task.done .dot .stepnum{display:none}
  .dot .stepnum{font-family:var(--mono);font-size:14px;font-weight:500}
  .task.done .task-label{color:var(--muted);text-decoration:line-through}
  .task.done .sub{font-family:var(--mono);color:var(--muted)}
  /* ready: everything it needs is done */
  .task.ready .dot{border-color:var(--ready);background:var(--ready-bg);color:var(--ready)}
  .task.ready .sub{font-weight:600;color:var(--ready);text-transform:uppercase;letter-spacing:.06em}
  /* next: first unlocked, unchecked step in each row */
  .task.next .dot{border-color:var(--ready);background:var(--ready-bg);color:var(--ready)}
  .task.next .sub{font-weight:600;color:var(--ready);text-transform:uppercase;letter-spacing:.06em}
  /* waiting: blocked by earlier steps */
  .task.waiting .dot{border-style:dashed;background:#F4F5F7;color:#8A90A0}
  .task.waiting .dot .stepnum{display:none}
  .task.waiting .dot .ico-lock{display:block}
  .task.waiting .task-label{color:var(--muted)}
  .task.waiting .sub{color:var(--muted)}
  .task:hover .dot{border-color:var(--ink)}

  /* Dependency highlight on hover / focus */
  .rows.tracing .task{opacity:.28}
  .rows.tracing .task.is-focus,.rows.tracing .task.is-need,.rows.tracing .task.is-unlock{opacity:1}
  .task.is-focus .dot{box-shadow:0 0 0 4px rgba(22,24,29,.15)}
  .task.is-need .dot{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 4px var(--accent-bg)}
  .task.is-unlock .dot{border-color:var(--accent);border-style:dashed;box-shadow:0 0 0 4px var(--accent-bg)}
  .rel{display:none;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);border-radius:4px;padding:1px 6px;position:absolute;top:-18px;white-space:nowrap}
  .task.is-need .rel,.task.is-unlock .rel{display:block}

  .finish{position:relative;z-index:1;flex:0 1 112px;min-width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px;text-align:center}
  .flag{width:44px;height:44px;border-radius:10px;border:2px dashed #B4BAC6;background:#fff;display:flex;align-items:center;justify-content:center;color:#8A90A0}
  .finish span{font-size:13px;font-weight:500;color:var(--muted)}
  .row.complete .flag{border:2px solid var(--ink);background:var(--ink);color:#fff}
  .row.complete .finish span{color:var(--ink)}

  .divider{display:flex;align-items:center;gap:16px;margin:20px 0 4px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#C9CED8}
  .row.ifneeded{border-style:dashed;border-color:#B4BAC6}
  .row.ifneeded .row-head{background:#F8F9FB}
  .row.ifneeded.inprog .row-head .state{color:var(--ready)}

  .launched{display:none;background:var(--ink);color:#fff;border-radius:12px;padding:16px 24px;font-size:16px;font-weight:500}
  .launched.show{display:block}

  /* Bottom bar: what the hovered step needs and unlocks */
  .trace-bar{position:fixed;left:50%;bottom:16px;transform:translate(-50%,12px);width:min(1100px,calc(100vw - 32px));background:var(--ink);color:#fff;border-radius:12px;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px 28px;font-size:13px;line-height:20px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:10;box-shadow:0 12px 40px rgba(22,24,29,.25)}
  .trace-bar.show{opacity:1;transform:translate(-50%,0)}
  .trace-bar strong{font-weight:600;width:100%}
  .trace-bar .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#AEB4C2;margin-right:8px}
  .trace-bar .ok{color:#AEB4C2;text-decoration:line-through}

  /* Hover tooltip: what a locked step is waiting on */
  .tip{position:fixed;z-index:20;max-width:280px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;font-size:13px;line-height:18px;pointer-events:none;opacity:0;transform:translate(-50%,-100%);transition:opacity .12s;box-shadow:0 8px 24px rgba(22,24,29,.2)}
  .tip.show{opacity:1}
  .tip b{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#AEB4C2;margin-bottom:4px}
  .tip ul{margin:0;padding:0 0 0 16px}
  .tip-note{white-space:pre-wrap;background:#FFE58A;color:#3D2E00;border-radius:6px;padding:8px 10px;margin:-2px -4px 8px}
  .tip-note:last-child{margin-bottom:-2px}
  .tip-note b{color:#7A5B00}
  .sticky{position:absolute;top:-10px;left:calc(50% + 10px);z-index:2;width:22px;height:22px;background:#FFD84D;border-radius:3px 3px 3px 9px;box-shadow:0 2px 4px rgba(22,24,29,.2);transform:rotate(6deg);display:flex;align-items:center;justify-content:center}
  .tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}

  /* Step panel (slides in from the right) */
  dialog.drawer{position:fixed;inset:0;margin:auto;height:fit-content;max-height:calc(100vh - 48px);width:min(640px,calc(100vw - 32px));max-width:none;border:1px solid var(--line);border-radius:14px;padding:0;color:var(--ink);font-family:inherit;background:#fff;box-shadow:0 20px 60px rgba(22,24,29,.25);overflow:hidden}
  dialog.drawer[open]{display:flex;flex-direction:column}
  dialog.drawer::backdrop{background:rgba(22,24,29,.3)}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:24px 24px 0}
  .p-head h3{margin:4px 0 0;font-size:20px;line-height:26px;font-weight:600}
  .p-status{margin-top:6px;font-size:13px;color:var(--muted)}
  .icon-btn{width:44px;height:44px;flex:none;border-radius:8px;border:1px solid #C9CED8;background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .p-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
  .p-body > *{flex-shrink:0}
  .psteps{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:22px;background:#F8F9FB}
  .psteps ul{margin:2px 0 0;padding-left:20px}
  .psteps a{color:var(--accent)}
  .psteps .warn{color:#B42318;font-weight:600}
  .psteps .miss{background:#FFF1C2;border-radius:3px;padding:0 2px}
  .ptip{margin:0;font-size:14px;line-height:21px;color:var(--ink)}
  .plinks{display:flex;flex-wrap:wrap;gap:8px}
  .plinks a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #C9CED8;color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
  .plinks a:hover{border-color:var(--accent);background:var(--accent-bg)}
  .pfields{display:flex;flex-direction:column;gap:12px}
  .pf{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
  .pf input,.pnotes{width:100%;min-height:44px;border:1px solid #C9CED8;border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);background:#fff;resize:vertical}
  .pf select{width:100%;min-height:44px;border:1px solid #C9CED8;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
  .pf select:focus,.pf input:focus,.pnotes:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .pwrap{display:flex;gap:8px}
  .pwrap input{flex:1;min-width:0}
  .pwrap .btn{display:inline-flex;align-items:center;text-decoration:none;flex:none}
  .qcard{border:0;margin:0 0 14px;padding:0}
  .qcard legend{padding:0;margin-bottom:8px;font-size:15px;font-weight:600;color:var(--ink)}
  .qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qopt{display:flex;align-items:flex-start;gap:10px;min-height:56px;padding:12px 14px;border:2px solid #C9CED8;border-radius:10px;background:#fff;font:inherit;text-align:left;color:var(--ink);cursor:pointer}
  .qopt:hover{border-color:var(--ink)}
  .qopt.on{border-color:var(--ink);background:#F4F5F7}
  .qopt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .qradio{width:20px;height:20px;flex:none;margin-top:1px;border-radius:10px;border:2px solid #9AA1AE;background:#fff}
  .qopt.on .qradio{border:6px solid var(--ink)}
  .qtext{display:flex;flex-direction:column;gap:2px}
  .qtext b{font-size:14px;font-weight:600}
  .qtext span{font-size:12px;color:var(--muted)}
  .pfirst.done .qopt.on{border-color:#2E7D4F}
  .pfirst.done .qopt.on .qradio{border-color:#2E7D4F}
  @media (max-width:560px){ .qopts{grid-template-columns:1fr} }
  .pchoice{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .pchoice-label{font-size:13px;font-weight:600}
  .pfirst{border:2px solid #F2C94C;background:#FFFBEA;border-radius:12px;padding:14px 16px 16px}
  .pfirst.done{border-color:#2E7D4F;background:#EAF6EE}
  .pfirst.done .pfirst-title{color:#1E6B3D}
  .pfirst.done .pf span{color:#1E6B3D}
  .pfirst.done .pf input{border-color:#9CCDAE}
  .pfirst-title{display:inline-flex;align-items:center;gap:8px}
  .pfirst-title svg{display:none}

  .tpl{border:1px solid var(--line);border-radius:10px;overflow:hidden}

  .tpl-subj{display:block;width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:#F8F9FB}
  .tpl-body{display:block;width:100%;border:0;padding:14px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:21px;color:#222;min-height:120px;max-height:420px;overflow-y:auto;background:#fff}

  .tpl-body a{color:#1155CC}
  .tpl-body .miss{background:#FFF1C2;border-radius:3px;padding:0 2px}
  .tpl-note{font-size:13px;color:var(--muted)}
  .tpl-subj:focus,.tpl-body:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .tpl-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
  .tpl-reset{margin-left:auto;background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline}
  @media (max-width:560px){ .pto{grid-template-columns:1fr} }

  .uncheck-confirm span{flex:1 1 200px;min-width:0;font-size:14px;font-weight:500;color:#912018}
  .uncheck-confirm .btn{flex:none}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  @media (max-width:720px){
    .wrap{padding:24px 16px 48px}
    .row{flex-direction:column;flex-wrap:nowrap}

    .trace-bar{display:none}
  }
  @media (prefers-reduced-motion:reduce){.rail-fill,.dot,.task,.trace-bar{transition:none}}

/* Turn a template into Gmail-friendly HTML.
   **bold**, [link text](url), lines starting "- " become bullets. */
function toHTML(text){
  text = prep(text);
  var inf = info(), M1 = '\u0001', M2 = '\u0002';
  var t = text.replace(/\{(\w+)\}/g, function(m, k){
    if (k === 'client') return data.current;
    var v = val(k);
    return v ? fmt(k, v) : M1 + (FIELDS[k] ? FIELDS[k].label : k) + M2;
  });
  t = esc(t);
  var miss = function(str){ return str.replace(/\u0001([^\u0002]*)\u0002/g, '<span class="miss">[$1]</span>'); };
  var inline = function(str){
    str = str.replace(/\[([^\]]+)\]\(([^)]*)\)/g, function(m, label, url){
      return url.indexOf(M1) >= 0 ? label + ' ' + miss(url) : '<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    str = str.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    str = str.replace(/!!(.+?)!!/g, '<span class="warn">$1</span>');
    return miss(str);
  };
  var out = '', list = false;
  t.split('\n').forEach(function(line){
    if (/^- /.test(line)){ if (!list){ out += '<ul>'; list = true; } out += '<li>' + inline(line.slice(2)) + '</li>'; return; }
    if (list){ out += '</ul>'; list = false; }
    out += line.trim() ? '<div>' + inline(line) + '</div>' : '<div><br></div>';
  });
  if (list) out += '</ul>';
  return out;
}

/* Plain-text version for the Gmail draft: bullets become •, links become "text (link)". */
function plainEmail(){

      }).join('');
    })
    .catch(function(){ alertHome('Couldn\'t load clients. Check your connection and refresh.'); });
}
function bootClient(){
  fetch(API + '?id=' + encodeURIComponent(CLIENT_ID), { cache: 'no-store' })
    .then(function(r){ if (r.status === 404) throw new Error('missing'); if (!r.ok) throw new Error(); return r.json(); })
    .then(function(rec){
      adopt(rec);
      document.title = rec.name + ' · Onboarding';
      render(); setView(data.view || 'list');
      setInterval(refresh, 15000);
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); });
    })
    .catch(function(e){
      $('clientTitle').textContent = e.message === 'missing' ? 'Client not found' : 'Couldn\'t load this client';
      setSync(e.message === 'missing' ? 'Check the link, or go back to All clients.' : 'Check your connection and refresh.', true);
    });
}
window.addEventListener('resize', function(){ if (CLIENT_ID) layoutRails(); });
document.fonts && document.fonts.ready.then(function(){ if (CLIENT_ID) layoutRails(); });
window.addEventListener('beforeunload', function(e){ if (saving || dirty || lastErr){ flush(); e.preventDefault(); e.returnValue = ''; } });

if (CLIENT_ID) bootClient(); else bootHome();
</script>
</body>
</html>
